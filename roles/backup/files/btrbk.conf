timestamp_format        long
stream_buffer          256m
stream_compress        zstd

volume /tmp/btrfs-root
  snapshot_dir /tmp/btrfs-root/_btrbk_snap
  snapshot_preserve    no
  target_preserve      7d 4w 6m
  
  subvolume @
    snapshot_create ondemand
    target /mnt/veracrypt2/@root_backup
  
  subvolume @home
    snapshot_create ondemand
    target /mnt/veracrypt2/@home_backup
    
