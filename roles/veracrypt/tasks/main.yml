---
- name: "Veracrypt | Run Tasks: {{ ansible_distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"

- name: "Veracrypt | Configure sudoers to allow veracrypt without a password"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/veracrypt
    state: present
    create: true
    mode: "0644"
    line: "{{ ansible_env.USER }} ALL=(ALL) NOPASSWD: /usr/bin/veracrypt"
    validate: "visudo -cf %s"

- name: "Veracrypt | Set variables for Veracrypt mount"
  ansible.builtin.set_fact:
    vault_secret_path: "{{ lookup('env', 'HOME') }}/.ansible-vault/vault.secret"
    veracrypt_pim: "{{ veracrypt_pim }}"
    user_id: "{{ lookup('pipe', 'id -u') }}"
    group_id: "{{ lookup('pipe', 'id -g') }}"

- name: "Veracrypt | Read password from file"
  ansible.builtin.slurp:
    src: "{{ vault_secret_path }}"
  register: vault_secret_content

- name: "Veracrypt | Create service for mounting Veracrypt volume 1"
  ansible.builtin.template:
    src: veracrypt-mount1.service.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/systemd/user/veracrypt-mount1.service"
    mode: "0644"
  vars:
    password: "{{ vault_secret_content['content'] | b64decode | trim }}"

- name: "Veracrypt | Create service for mounting Veracrypt volume 2"
  ansible.builtin.template:
    src: veracrypt-mount2.service.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/systemd/user/veracrypt-mount2.service"
    mode: "0644"
  vars:
    password: "{{ vault_secret_content['content'] | b64decode | trim }}"

- name: "Veracrypt | Start and enable service 1"
  ansible.builtin.systemd:
    name: veracrypt-mount1.service
    scope: user
    state: started
    enabled: true
    daemon_reload: true

- name: "Veracrypt | Start and enable service 2"
  ansible.builtin.systemd:
    name: veracrypt-mount2.service
    scope: user
    state: started
    enabled: true
    daemon_reload: true

- name: "Veracrypt | Enable lingering for user to allow user services to run at boot"
  become: true
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_env.USER }}
  changed_when: false
