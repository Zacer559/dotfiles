---
- name: "Neovim | Checking for Distribution Config: {{ ansible_distribution }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_distribution }}.yml"
  register: neovim_distribution_config

- name: "Neovim | Run Distribution-Specific Tasks: {{ ansible_distribution }}"
  ansible.builtin.include_tasks: "{{ ansible_distribution }}.yml"
  when: neovim_distribution_config.stat.exists

- name: "Neovim | Check if config folder is a symlink"
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.config/nvim"
  register: neovim_config_stat

- name: "Neovim | Remove existing config folder if not a symlink"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/nvim"
    state: absent
  when: neovim_config_stat.stat.exists and not neovim_config_stat.stat.islnk

- name: "Neovim | Ensure config folder exists or is a symlink"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/nvim"
    state: absent
  when: neovim_config_stat.stat.exists and not neovim_config_stat.stat.islnk

- name: "Neovim | Create symlink for config folder"
  ansible.builtin.file:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_user_dir }}/.config/nvim"
    state: link
    force: true

- name: "Neovim | Create root symlink for sudo preservation"
  ansible.builtin.file:
    src: "{{ ansible_user_dir }}/.config/nvim"
    dest: /root/.config/nvim
    state: link
    force: true
  become: yes

- name: "Neovim | Ensure root local share directory exists"
  ansible.builtin.file:
    path: /root/.local/share
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: "Neovim | Ensure user local share directory exists"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/share/nvim"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    recurse: yes

- name: "Neovim | Create root plugin symlink"
  ansible.builtin.file:
    src: "{{ ansible_user_dir }}/.local/share/nvim"
    dest: /root/.local/share/nvim
    state: link
    force: true
  become: yes
